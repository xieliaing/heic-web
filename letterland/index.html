<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4a7cf0" />
  <title>LetterLand — Learn to Read &amp; Spell in English</title>
  <meta name="description" content="A free, private, offline-friendly game that teaches children to read and spell English words. Menus in English, French, German, Korean and Chinese." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />

  <!-- One app, six interface languages. ?lang= only switches the menus and
       instructions — the words being taught are English in every case. -->
  <link rel="canonical" href="https://heicquick.com/letterland/" />
  <link rel="alternate" hreflang="en" href="https://heicquick.com/letterland/" />
  <link rel="alternate" hreflang="fr" href="https://heicquick.com/letterland/?lang=fr" />
  <link rel="alternate" hreflang="de" href="https://heicquick.com/letterland/?lang=de" />
  <link rel="alternate" hreflang="ko" href="https://heicquick.com/letterland/?lang=ko" />
  <link rel="alternate" hreflang="zh-Hans" href="https://heicquick.com/letterland/?lang=zh-cn" />
  <link rel="alternate" hreflang="zh-Hant" href="https://heicquick.com/letterland/?lang=zh-tw" />
  <link rel="alternate" hreflang="x-default" href="https://heicquick.com/letterland/" />

  <!-- Installable web app (PWA): manifest, offline support, and iOS home-screen icon -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LetterLand" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="decor" aria-hidden="true"></div>
  <main id="app"><!-- screens render here --></main>

  <!-- LetterLand namespace, then modules in dependency order -->
  <script>window.WB = {};</script>
  <script src="js/i18n.js"></script>
  <script src="js/words.js"></script>
  <script src="js/words-explorer.js"></script>
  <script src="js/words-explorer-2.js"></script>
  <script src="js/words-explorer-3.js"></script>
  <script src="js/words-explorer-4.js"></script>
  <script src="js/words-explorer-5.js"></script>
  <script src="js/banks.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>

  <!-- Register the service worker for offline play and home-screen install.
       Path is relative, so it works from the site root or a subfolder. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () { /* offline unsupported; app still runs */ });
      });
    }
  </script>
</body>
</html>
